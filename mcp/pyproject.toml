[project]
name = "medbeads-mcp"
version = "0.1.0"
description = "Model Context Protocol server for MedBeads — exposes the immutable clinical Merkle-DAG to MCP clients"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
