[project]
name = "bench"
version = "0.1.0"
description = "MedBeads MICCAI experiment harness (M2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "mcp>=1.28.1",
    "sentence-transformers>=5.6.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
markers = [
    "slow_model: requires a real sentence-transformers model load/download (~1GB); skipped unless MEDBEADS_RUN_SLOW_MODEL_TESTS=1 is set (CI has no model cache).",
]
