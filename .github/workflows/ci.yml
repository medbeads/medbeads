name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      # index.db uses github.com/mattn/go-sqlite3 (CGO) with the sqlite_fts5
      # build tag, for FTS5 trigram search (R3.3) and a future sqlite-vec
      # load path (R4.2). CGO_ENABLED=1 is required to build/test that
      # driver at all; the tag is required for FTS5 support specifically
      # (see internal/engine/index's schema migrations).
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Build
        run: go build -tags sqlite_fts5 ./...
      - name: Vet
        run: go vet -tags sqlite_fts5 ./...
      - name: Test
        run: go test -tags sqlite_fts5 ./... -race

  bench:
    name: bench (uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies (incl. dev group)
        run: uv sync --dev
      - name: Test
        run: uv run pytest -q

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        # Non-blocking: the repo has pre-existing eslint debt unrelated to the
        # test suite. Surfaces new issues without failing the build.
        continue-on-error: true
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build (type-check + bundle)
        run: npm run build

  paper-demo-docker:
    name: Paper demo (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build the public paper demo
        run: docker compose build
      - name: Start the demo
        run: docker compose up -d
      - name: Verify UI, API, graph projection, and Pod integrity
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5174/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/patients >/tmp/patients.json; then
              break
            fi
            sleep 1
          done

          test "$(jq 'length' /tmp/patients.json)" -eq 10
          test "$(curl --fail --silent http://127.0.0.1:5174/api/core/patients | jq 'length')" -eq 10

          links="$({
            jq -r '.[].id' /tmp/patients.json | while read -r root; do
              curl --fail --silent "http://127.0.0.1:8080/patients/${root}/graph"
            done
          } | jq -s '[.[].links | length] | add')"
          test "${links}" -eq 492

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://127.0.0.1:8080/patients)" -eq 405
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://127.0.0.1:8080/beads)" -eq 405

          docker compose exec -T core medbeadsd verify -data /data
      - name: Show logs and stop the demo
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
          docker compose down
