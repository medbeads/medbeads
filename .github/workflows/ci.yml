name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      # index.db uses github.com/mattn/go-sqlite3 (CGO) with the sqlite_fts5
      # build tag, for FTS5 trigram search (R3.3) and a future sqlite-vec
      # load path (R4.2). CGO_ENABLED=1 is required to build/test that
      # driver at all; the tag is required for FTS5 support specifically
      # (see internal/engine/index's schema migrations).
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Build
        run: go build -tags sqlite_fts5 ./...
      - name: Vet
        run: go vet -tags sqlite_fts5 ./...
      - name: Test
        run: go test -tags sqlite_fts5 ./... -race

  bench:
    name: bench (uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies (incl. dev group)
        run: uv sync --dev
      - name: Test
        run: uv run pytest -q

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        # Non-blocking: the repo has pre-existing eslint debt unrelated to the
        # test suite. Surfaces new issues without failing the build.
        continue-on-error: true
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build (type-check + bundle)
        run: npm run build
