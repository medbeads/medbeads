name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    name: Go core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache-dependency-path: core/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        # CGO is required by go-sqlite3; the ubuntu runner ships gcc.
        env:
          CGO_ENABLED: '1'
        run: go test ./... -race -coverprofile=coverage.out
      - name: Coverage summary
        run: go tool cover -func=coverage.out

  api:
    name: Python AI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies (incl. dev group)
        run: uv sync --dev
      - name: Syntax check
        run: uv run python -m compileall main.py ai.py
      - name: Test
        run: uv run pytest tests/ -q

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        # Non-blocking: the repo has pre-existing eslint debt unrelated to the
        # test suite. Surfaces new issues without failing the build.
        continue-on-error: true
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build (type-check + bundle)
        run: npm run build
