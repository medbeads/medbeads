services:
  core:
    build: ./core
    ports:
      - "8080:8080"
    volumes:
      # Mount pre-populated sample data for demo.
      # This directory contains processed Beads data ready for use.
      - ./core/medbeads_data:/app/medbeads_data
    restart: unless-stopped

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - CORE_URL=http://core:8080
      # User needs to provide GEMINI_API_KEY in .env
      # User can provide GEMINI_API_KEY in .env or environment variables
    # env_file:
    #   - .env
    depends_on:
      - core
    restart: unless-stopped

  ui:
    build: ./ui
    ports:
      - "5174:5174"
    depends_on:
      - core
      - api
    restart: unless-stopped
