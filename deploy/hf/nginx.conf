worker_processes 1;
daemon off;
user root;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    server {
        # Hugging Face Spaces port
        listen 7860;

        # 1. UI (React Static Files)
        location / {
            root /app/ui/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. Core API (Go)
        # Frontend calls /api/core/patients -> Backend receives /patients
        location /api/core/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. AI API (Python)
        # Frontend calls /api/ai/analyze -> Backend receives /analyze
        location /api/ai/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
